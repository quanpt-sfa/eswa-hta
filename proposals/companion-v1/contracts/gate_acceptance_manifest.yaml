# Gate Acceptance Manifest Contract (Candidate Proposal v1.0)
# Governance: docs/HTA_IMPLEMENTATION_SPEC_v1.2.md (§16.1, Rules A1-A12)
# Status: CANDIDATE_PROPOSAL_PENDING_HUMAN_SIGN_OFF

manifest_version: "1.2"
project: "HTA-TabICL"

gates:
  G0:
    name: "Environment and Bundle Preflight"
    requires_approvals: []
    input_files:
      - path: "config/protocol.yaml"
        access_class: "read_only"
      - path: "config/columns.yaml"
        access_class: "read_only"
      - path: "reference/hta_ref.py"
        access_class: "read_only"
      - path: "reference/test_hta_ref.py"
        access_class: "read_only"
      - path: "fixtures/golden_cases.csv"
        access_class: "read_only"
      - path: "fixtures/golden_expectations.csv"
        access_class: "read_only"
      - path: "fixtures/fixture_manifest.sha256"
        access_class: "read_only"
    expected_outputs:
      - path: "src/hta/ref.py"
        description: "Byte-identical copy of reference/hta_ref.py"
      - path: "environment_lock.txt"
        description: "Frozen pip versions, python build, GPU metadata, model checkpoint hashes"
      - path: "outputs/G0/api_preflight.json"
        description: "API probe geometry, raw quantiles shape, distribution checks"
      - path: "gates/G0_QA_report.md"
        description: "Preflight verification and QA summary"
    primary_key: null
    row_scope: "N/A"
    qa_command: "pytest -q reference/ tests/test_g0.py"
    expected_exit_code: 0
    numeric_tolerances:
      analytic_prob_tol: 1e-10
      quantile_interp_tol: 5e-4
    stop_conditions:
      - "Missing companion files"
      - "Golden fixture failure"
      - "Byte-identity mismatch between src/hta/ref.py and reference/hta_ref.py"
      - "Unverified TabICL quantile shape or unmonotonic alpha levels"
      - "Unverified holdout isolation"
    unlock_policy: "PROTECTED_OUTCOMES_STRICTLY_FORBIDDEN"
    approval_owner: "Human Research Lead"

  G1:
    name: "Canonical Data and Label Construction"
    requires_approvals: ["gates/G0_APPROVED.txt"]
    input_files:
      - path: "data/source/canonical_dev_source.parquet"
        access_class: "development_only_2015_2022"
      - path: "config/columns.yaml"
        access_class: "human_approved_mapping"
    expected_outputs:
      - path: "data/processed/canonical_dev.parquet"
        primary_key: ["firm_id", "fiscal_year"]
        row_scope: "Development years 2015-2022 only"
      - path: "outputs/G1/sample_attrition.csv"
      - path: "outputs/G1/label_reconciliation_by_year.csv"
      - path: "outputs/G1/duplicates.csv"
      - path: "gates/G1_QA_report.md"
    primary_key: ["firm_id", "fiscal_year"]
    row_scope: "2015 <= fiscal_year <= 2022; one scope per firm-year"
    qa_command: "pytest -q tests/test_g1.py"
    expected_exit_code: 0
    numeric_tolerances:
      delta_exact_tol: 0.0
      nesting_monotonicity_tol: 0.0
    stop_conditions:
      - "Duplicate firm-year keys in canonical table"
      - "delta != pat_post - pat_pre"
      - "Violation of nesting y_k200 <= y_k150 <= y_k100 <= y_k075 <= y_k050"
      - "Row with eligible_model True and total_assets_pre <= 0"
      - "Any FY2023-2025 data present in canonical_dev.parquet"
    unlock_policy: "PROTECTED_OUTCOMES_STRICTLY_FORBIDDEN"
    approval_owner: "Human Research Lead"

  G2:
    name: "Point-in-Time Core Features (X1)"
    requires_approvals: ["gates/G1_APPROVED.txt"]
    input_files:
      - path: "data/processed/canonical_dev.parquet"
      - path: "config/columns.yaml"
    expected_outputs:
      - path: "data/processed/features_X1.parquet"
      - path: "outputs/G2/feature_availability_audit.csv"
      - path: "gates/G2_QA_report.md"
    primary_key: ["firm_id", "fiscal_year"]
    row_scope: "Matches canonical_dev.parquet exactly"
    qa_command: "pytest -q tests/test_g2.py"
    expected_exit_code: 0
    stop_conditions:
      - "Feature publication date > prediction cutoff"
      - "Lag feature constructed across discontinuous years without audit date"
    unlock_policy: "PROTECTED_OUTCOMES_STRICTLY_FORBIDDEN"
    approval_owner: "Human Research Lead"

  G3:
    name: "Diagnostics, Descriptive Invariants, and Sample Audits"
    requires_approvals: ["gates/G2_APPROVED.txt"]
    input_files:
      - path: "data/processed/canonical_dev.parquet"
      - path: "data/processed/features_X1.parquet"
    expected_outputs:
      - path: "outputs/G3/table1_summary_stats.csv"
      - path: "outputs/G3/zero_adjustment_diagnostics.csv"
      - path: "gates/G3_QA_report.md"
    primary_key: ["firm_id", "fiscal_year"]
    row_scope: "Development years 2015-2022"
    qa_command: "pytest -q tests/test_g3.py"
    expected_exit_code: 0
    stop_conditions:
      - "Retrospective tuning of zero tolerance (prohibited by D07)"
    unlock_policy: "PROTECTED_OUTCOMES_STRICTLY_FORBIDDEN"
    approval_owner: "Human Research Lead"

  G4:
    name: "Feature Set X2 and Expanding-Window Data Splits"
    requires_approvals: ["gates/G3_APPROVED.txt"]
    input_files:
      - path: "data/processed/canonical_dev.parquet"
      - path: "data/processed/features_X1.parquet"
      - path: "config/protocol.yaml"
    expected_outputs:
      - path: "data/processed/features_X2.parquet"
      - path: "data/processed/dev_splits.json"
      - path: "gates/G4_QA_report.md"
    primary_key: ["firm_id", "fiscal_year"]
    row_scope: "Development years 2015-2022; Folds F1-F4 locked"
    qa_command: "pytest -q tests/test_g4.py"
    expected_exit_code: 0
    stop_conditions:
      - "Temporal leakage across train/validation splits"
      - "near_zero_bins calculated on non-development data"
    unlock_policy: "PROTECTED_OUTCOMES_STRICTLY_FORBIDDEN"
    approval_owner: "Human Research Lead"

  G5:
    name: "Pilot Baselines B1, B3a, B3b, B4, B6 (Development Only)"
    requires_approvals: ["gates/G4_APPROVED.txt"]
    input_files:
      - path: "data/processed/features_X2.parquet"
      - path: "outputs/G4/folds.csv"
      - path: "config/protocol.yaml"
    expected_outputs:
      - path: "outputs/G5/predictions_B1.parquet"
      - path: "outputs/G5/predictions_B3a.parquet"
      - path: "outputs/G5/predictions_B3b.parquet"
      - path: "outputs/G5/predictions_B4.parquet"
      - path: "outputs/G5/predictions_B6.parquet"
      - path: "gates/G5_QA_report.md"
    primary_key: ["row_id", "model_id", "fold", "k"]
    row_scope: "Development validation years 2019-2022 ONLY"
    qa_command: "pytest -q tests/test_g5.py"
    expected_exit_code: 0
    stop_conditions:
      - "Missing any of the five registered pilot models"
      - "Any test-year outcome used during training or model selection"
      - "Unverified quantile grid or invalid prediction probabilities"
    unlock_policy: "PROTECTED_OUTCOMES_STRICTLY_FORBIDDEN"
    approval_owner: "Human Research Lead"

  G6:
    name: "Distributional Pilot GO/NO-GO (Based on B6; M1 not trained yet)"
    requires_approvals: ["gates/G5_APPROVED.txt"]
    input_files:
      - path: "outputs/G5/predictions_B3a.parquet"
      - path: "outputs/G5/predictions_B3b.parquet"
      - path: "outputs/G5/predictions_B4.parquet"
      - path: "outputs/G5/predictions_B6.parquet"
      - path: "config/protocol.yaml"
    expected_outputs:
      - path: "outputs/G6/pilot_go_no_go.json"
      - path: "gates/G6_QA_report.md"
    primary_key: null
    row_scope: "Pooled 2019-2022 OOF predictions (development only)"
    qa_command: "pytest -q tests/test_g6.py"
    expected_exit_code: 0
    stop_conditions:
      - "Pilot margins lack human approval"
      - "NO-GO/grey zone bypassed without human decision"
      - "Any final-test-derived decision"
    unlock_policy: "PROTECTED_OUTCOMES_STRICTLY_FORBIDDEN"
    approval_owner: "Human Research Lead"

  G7:
    name: "Hurdle Model Training and Full Dev Evaluation (B7, B8, M1)"
    requires_approvals: ["gates/G6_APPROVED.txt"]
    input_files:
      - path: "data/processed/features_X2.parquet"
      - path: "data/processed/dev_splits.json"
    expected_outputs:
      - path: "outputs/G7/predictions_val_folds_hurdle.parquet"
      - path: "outputs/G7/validation_metrics_hurdle.csv"
      - path: "gates/G7_QA_report.md"
    primary_key: ["firm_id", "fiscal_year", "model_id"]
    row_scope: "Validation folds (2019-2022)"
    qa_command: "pytest -q tests/test_g7.py"
    expected_exit_code: 0
    unlock_policy: "PROTECTED_OUTCOMES_STRICTLY_FORBIDDEN"
    approval_owner: "Human Research Lead"

  G8:
    name: "Probability Calibration (Optional Sensitivity)"
    requires_approvals: ["gates/G7_APPROVED.txt"]
    input_files:
      - path: "outputs/G7/predictions_val_folds_hurdle.parquet"
    expected_outputs:
      - path: "outputs/G8/calibration_audit.md"
      - path: "gates/G8_QA_report.md"
    primary_key: null
    row_scope: "Development folds only"
    qa_command: "pytest -q tests/test_g8.py"
    expected_exit_code: 0
    unlock_policy: "PROTECTED_OUTCOMES_STRICTLY_FORBIDDEN"
    approval_owner: "Human Research Lead"

  G9:
    name: "Complete B1-B8 and E1-E5 Development Experiments (Not Final Test)"
    requires_approvals: ["gates/G7_APPROVED.txt"]
    input_files:
      - path: "data/processed/features_X2.parquet"
      - path: "outputs/G4/folds.csv"
      - path: "outputs/G5/predictions_B6.parquet"
      - path: "outputs/G7/predictions_val_folds_hurdle.parquet"
    expected_outputs:
      - path: "outputs/G9/E1_distributional_comparison.csv"
      - path: "outputs/G9/E2_hurdle_ablation.csv"
      - path: "outputs/G9/E3_threshold_comparison.csv"
      - path: "outputs/G9/E4_threshold_transfer.csv"
      - path: "outputs/G9/E5_near_zero_subgroups.csv"
      - path: "gates/G9_QA_report.md"
    primary_key: null
    row_scope: "Development out-of-fold 2019-2022; no FY2023-2025 outcomes or test scores"
    qa_command: "pytest -q tests/test_g9.py"
    expected_exit_code: 0
    stop_conditions:
      - "B2/B5 or required model ablations missing"
      - "Any experimental adjustment using protected final-test information"
    unlock_policy: "PROTECTED_OUTCOMES_STRICTLY_FORBIDDEN"
    approval_owner: "Human Research Lead"

  G10:
    name: "Freeze Models, Predict Blinded Test Candidates, Then Human Unlock for Evaluation"
    requires_approvals: ["gates/G9_APPROVED.txt"]
    input_files:
      - path: "data/source/test_features_candidate.parquet"
      - path: "config/protocol.yaml"
      - path: "data/locked/test_outcomes.parquet"
        access_class: "HUMAN_UNSEALED_ONLY_AFTER_MODEL_AND_PREDICTION_LOCK"
      - path: "data/locked/HUMAN_UNLOCK_G10.txt"
        access_class: "HUMAN_ONLY_AFTER_MODEL_LOCK"
    expected_outputs:
      - path: "outputs/G10/final_model_lock.json"
      - path: "outputs/G10/final_test_predictions.parquet"
      - path: "outputs/G10/primary_metric_results.csv"
      - path: "outputs/G10/paired_bootstrap_results.csv"
      - path: "gates/G10_QA_report.md"
    primary_key: ["row_id", "model_id", "fold", "k"]
    row_scope: "Prediction first on FY2023-2025 pre-audit candidates; join sealed labels only AFTER human unlock"
    qa_command: "pytest -q tests/test_g10.py"
    expected_exit_code: 0
    stop_conditions:
      - "Primary model or comparator not locked from development"
      - "Human unlock missing or checksum does not match frozen model lock"
      - "Test outcomes readable before all test predictions are frozen"
      - "Post-audit label used for prediction-row selection"
    unlock_policy: "TWO_PHASE_HUMAN_UNLOCK_AFTER_LOCKED_PREDICTIONS"
    approval_owner: "Human Research Lead"

  G11:
    name: "Robustness, S3 Enforcement Ledger Validation, and Subgroup Analyses"
    requires_approvals: ["gates/G10_APPROVED.txt"]
    input_files:
      - path: "outputs/G10/primary_endpoint_table.csv"
    expected_outputs:
      - path: "outputs/G11/table_robustness.csv"
      - path: "outputs/G11/enforcement_ledger_validation.csv"
      - path: "gates/G11_QA_report.md"
    primary_key: null
    row_scope: "Full sample descriptive / out-of-fold and test matches"
    qa_command: "pytest -q tests/test_g11.py"
    expected_exit_code: 0
    unlock_policy: "TEST_OUTCOMES_AUTHORIZED"
    approval_owner: "Human Research Lead"

  G12:
    name: "Replication Package and Final Artifact Lock"
    requires_approvals: ["gates/G11_APPROVED.txt"]
    input_files:
      - path: "outputs/"
      - path: "src/"
      - path: "config/"
    expected_outputs:
      - path: "outputs/G12/REPLICATION_CHECKSUMS.sha256"
      - path: "outputs/G12/final_reconciliation_audit.md"
      - path: "gates/G12_QA_report.md"
    primary_key: null
    row_scope: "Entire repository"
    qa_command: "pytest -q tests/"
    expected_exit_code: 0
    stop_conditions:
      - "Hash mismatch in final replication bundle"
    unlock_policy: "ALL_DATA_AUTHORIZED"
    approval_owner: "Human Research Lead"
